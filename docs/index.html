<style>
:root{--orbix:#7d1b85;--orbix-2:#9a2ea3;--orbix-dark:#4a0f50;--dtel:#ffd500;--bg:#141414}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:#fff;overflow:hidden}
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(90% 120% at 15% 0%,#3a0c40 0%,#1b1b1b 55%,#121212 100%)}
#login::before{content:"";position:absolute;width:520px;height:520px;right:-140px;bottom:-160px;border-radius:50%;border:60px solid rgba(255,213,0,.06)}
#login::after{content:"";position:absolute;width:300px;height:300px;left:-90px;top:-90px;border-radius:50%;border:40px solid rgba(154,46,163,.18)}
.box{position:relative;z-index:1;width:min(400px,92vw);background:rgba(30,30,30,.82);backdrop-filter:blur(10px);border:1px solid #2e2e2e;border-radius:24px;padding:34px 32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logos{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.logos .dtel{width:128px}
.logos .orbix{display:flex;align-items:center;gap:9px;font:800 15px 'Manrope';letter-spacing:.5px}
.logos .orbix img{width:34px;height:34px}
h1{font:800 21px 'Manrope';margin:0}
h1::after{content:"";display:block;width:34px;height:4px;border-radius:4px;background:var(--dtel);margin-top:8px}
p.sub{color:#a3a3a3;font-size:13px;margin:10px 0 22px}
label{display:block;font-size:12px;color:#bdbdbd;margin:0 0 6px;font-weight:500}
input{width:100%;background:#151515;border:1px solid #333;border-radius:12px;padding:12px 14px;color:#fff;font:15px 'DM Sans';outline:0;margin-bottom:14px;transition:border-color .2s}
input:focus{border-color:var(--orbix-2)}
button{width:100%;border:0;border-radius:12px;padding:13px;font:700 14px 'DM Sans';cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--orbix),var(--orbix-2));box-shadow:0 10px 26px rgba(125,27,133,.35);transition:transform .2s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:wait}
.err{color:#ff9b9b;font-size:12.5px;min-height:18px;margin-top:10px;text-align:center}
.foot{color:#6f6f6f;font-size:11px;text-align:center;margin-top:16px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#dock{position:fixed;right:14px;bottom:14px;z-index:10;display:none;gap:8px}
#dock button{width:auto;padding:9px 14px;font-size:12px;border-radius:10px;background:#1e1e1e;border:1px solid #333;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@media (max-width:900px){#dock{right:10px;bottom:10px;opacity:.9}#dock button{padding:7px 10px;font-size:11px}}
#dock button.fs{background:linear-gradient(135deg,var(--orbix),var(--orbix-2));border:0}
</style>
</head>

    <h1>Monitoramento Proativo</h1>
    <p class="sub" id="sub">Acesso restrito. Entre com o usuário e a senha do painel.</p>
    <div id="campos">
      <label for="u">Usuário</label><input id="u" name="username" autocomplete="username" required>
      <label for="p">Senha</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button id="btn" type="submit">Entrar em tela cheia</button>
    <div class="err" id="err"></div>
    <div class="foot">Os dados deste painel ficam criptografados e só são abertos com as credenciais corretas.</div>
  </form>
</div>
<iframe id="app" title="Dashboard ORBIX"></iframe>
<div id="dock"><button class="fs" id="fsBtn" type="button">⛶ Tela cheia</button><button id="sair" type="button">Sair</button></div>

<script>
// Os dados cifrados ficam em painel.json e são sempre baixados sem cache:
// assim uma troca de senha ou atualização vale na hora, mesmo que esta página esteja em cache.
let PKG = null;
async function pacote(){ if (!PKG) { const r = await fetch('painel.json?v=' + Date.now(), {cache:'no-store'}); PKG = await r.json(); } return PKG; }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const SK = 'orbix-sessao';

async function chave(usuario, senha){
  await pacote();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(usuario.trim().toLowerCase() + ':' + senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PKG.salt), iterations:PKG.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function abrir(key){
  await pacote();
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PKG.iv)}, key, b64(PKG.data)));
  const app = document.getElementById('app');
  app.srcdoc = html;
  app.style.display = 'block';
  document.getElementById('login').style.display = 'none';
  document.getElementById('dock').style.display = 'flex';
  atualizaDock();
}
function telaCheia(){
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
}
function atualizaDock(){ document.getElementById('fsBtn').style.display = document.fullscreenElement ? 'none' : 'block'; }
document.addEventListener('fullscreenchange', atualizaDock);
document.getElementById('fsBtn').onclick = telaCheia;
document.getElementById('sair').onclick = () => { sessionStorage.removeItem(SK); if (document.fullscreenElement) document.exitFullscreen(); location.reload(); };

const form = document.getElementById('form'), btn = document.getElementById('btn'), err = document.getElementById('err');
const salva = sessionStorage.getItem(SK);
if (salva) {   // sessão aberta nesta aba: só falta o clique para a tela cheia
  document.getElementById('campos').style.display = 'none';
  document.getElementById('sub').textContent = 'Sessão ativa. Clique para abrir o painel.';
  btn.textContent = 'Abrir painel em tela cheia';
}
form.onsubmit = async e => {
  e.preventDefault(); err.textContent = ''; btn.disabled = true;
  telaCheia();                                  // precisa acontecer no clique (regra dos navegadores)
  try {
    let key;
    if (salva && document.getElementById('campos').style.display === 'none') {
      key = await crypto.subtle.importKey('raw', b64(salva), 'AES-GCM', true, ['decrypt']);
    } else {
      key = await chave(document.getElementById('u').value, document.getElementById('p').value);
    }
    await abrir(key);
    sessionStorage.setItem(SK, toB64(await crypto.subtle.exportKey('raw', key)));
  } catch (x) {
    if (document.fullscreenElement) document.exitFullscreen();
    sessionStorage.removeItem(SK);
    document.getElementById('campos').style.display = '';
    btn.textContent = 'Entrar em tela cheia';
    err.textContent = 'Usuário ou senha incorretos.';
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  }
  btn.disabled = false;
};
</script>
